tabs:
  main:
    display: Settings
    sections:
      -
        fields:
          -
            handle: enabled
            field:
              type: toggle
              display: 'Show notices'
              instructions: 'Off, no notice reaches a visitor on any site, whatever is published. The notices stay as they are.'
              default: true
          -
            handle: view
            field:
              type: button_group
              display: Presentation
              instructions: 'How the notices a visitor may close are shown: in a dialog, or as bars at the top of the page. Notices that cannot be closed are always bars.'
              options:
                modal: Dialog
                notice: Bars
              validate:
                - required_if_accepted:enabled
          -
            handle: wait
            field:
              type: button_group
              display: Delay
              instructions: 'Whether the dialog opens as soon as the page has loaded, or waits a few seconds.'
              options:
                no_wait: 'No wait'
                wait: Wait
              default: no_wait
          -
            handle: delay
            field:
              type: integer
              display: Seconds
              instructions: 'How many seconds the dialog waits after the page has loaded.'
              default: 3
              if:
                wait: 'equals wait'
              validate:
                # The server does not know the field's condition: no seconds are checked while "No wait" is picked.
                - 'exclude_unless:wait,wait'
                - required
                - integer
                - 'min:1'
                - 'max:60'
